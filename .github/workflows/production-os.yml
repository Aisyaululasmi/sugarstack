name: PRODUCTION OS

on:
  push:
    branches: ["rico/production-os"]
    paths:
      - '.github/workflows/production-os.yml'
      - 'Dockerfile'
      - 'startup.sh'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - 'tsconfig.base.json'

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: '1. Confirm workflow is running'
        run: echo "PRODUCTION OS WORKFLOW IS RUNNING."

      - name: '2. Checkout'
        uses: actions/checkout@v4

      - name: '3. Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: '4. Install dependencies'
        run: npm ci

      - name: '5. Run lint (type-check all packages)'
        run: npm run lint

  build:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: '1. Checkout'
        uses: actions/checkout@v4

      - name: '2. Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: '3. Install dependencies'
        run: npm ci

      - name: '4. Build all packages'
        run: npm run build

      - name: '5. Verify API build output'
        run: |
          echo "--- Checking API build output: ---"
          ls -la apps/api/dist/
          echo "----------------------------------"

      - name: '6. Verify Web build output'
        run: |
          echo "--- Checking Web build output: ---"
          ls -la apps/web/.next/ | head -20
          echo "----------------------------------"

  docker:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: '1. Checkout'
        uses: actions/checkout@v4

      - name: '2. Setup Docker Buildx'
        uses: docker/setup-buildx-action@v3

      - name: '3. Build Docker image (validate only, no push)'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: '4. Docker build validation passed'
        run: echo "Docker image built successfully. Railway will deploy on push."

  security:
    runs-on: ubuntu-latest

    steps:
      - name: '1. Checkout'
        uses: actions/checkout@v4

      - name: '2. Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: '3. Install dependencies'
        run: npm ci

      - name: '4. Run npm audit'
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: '5. Check for committed secrets'
        run: |
          echo "--- Scanning for potential secrets in tracked files: ---"
          FOUND=0
          # Check for .env files (excluding examples)
          if git ls-files | grep -E '\.env$|\.env\.local$' | grep -v example | grep -v sample; then
            echo "WARNING: .env files found in repo!"
            FOUND=1
          fi
          # Check for hardcoded keys in source files
          if grep -rn --include="*.ts" --include="*.tsx" --include="*.js" \
            -E '(sk-[a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36}|xoxb-[0-9a-zA-Z-]+)' \
            apps/ packages/ 2>/dev/null; then
            echo "WARNING: Potential hardcoded secrets found!"
            FOUND=1
          fi
          if [ "$FOUND" -eq 0 ]; then
            echo "No secrets detected."
          fi
          echo "-------------------------------------------------------"
